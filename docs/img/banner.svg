<svg xmlns="http://www.w3.org/2000/svg" width="880" height="200" viewBox="0 0 880 200" role="img" aria-label="llmtap">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#111c33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="880" height="200" rx="18" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="879" height="199" rx="17.5" fill="none" stroke="#1e293b"/>

  <!-- terminal window dots -->
  <circle cx="30" cy="28" r="6" fill="#f87171"/>
  <circle cx="50" cy="28" r="6" fill="#fbbf24"/>
  <circle cx="70" cy="28" r="6" fill="#34d399"/>

  <!-- prompt line -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="40" y="92" font-size="56" font-weight="700" fill="url(#accent)">llmtap</text>
    <text x="252" y="92" font-size="56" fill="#e2e8f0" opacity="0.18">▌</text>
    <text x="40" y="128" font-size="17" fill="#94a3b8">terminal tester for LLM APIs</text>
    <text x="40" y="162" font-size="14" fill="#64748b">TTFT · tok/s · ITL p95 · bench · downgrade probe · relay scan · TUI</text>
  </g>

  <!-- tiny sparkline on the right -->
  <g transform="translate(560,58)" stroke-linecap="round" stroke-linejoin="round">
    <polyline fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.9"
      points="0,80 30,62 60,70 90,38 120,46 150,22 180,30 210,12 240,20 270,6"/>
    <polyline fill="none" stroke="#a78bfa" stroke-width="3" opacity="0.6"
      points="0,96 30,90 60,92 90,76 120,80 150,66 180,70 210,58 240,62 270,54"/>
    <g fill="#34d399">
      <circle cx="270" cy="6" r="4.5"/>
    </g>
    <text x="0" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#64748b">TTFT  86 ms     decode  70.4 tok/s     p95  21 ms</text>
  </g>
</svg>
