name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "${{ matrix.python }}"
          enable-cache: true
      - name: Install
        run: uv sync --group dev
      - name: Lint
        run: uv run python -m pyflakes llmtap tests scripts
      - name: Test
        run: uv run pytest -q
