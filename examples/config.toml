# llmtap config example.
# Copy to ./llmtap.toml or ~/.config/llmtap/config.toml and edit.
# Profile name = section key. One profile holds one endpoint plus models.

[defaults]
prompt = "Count from 1 to 20, one number per line. Then write one short sentence about the sea."
max_tokens = 512
temperature = 0.7
timeout = 120

# ---- one profile, one model ----

[profiles.deepseek-chat]
base_url = "https://api.deepseek.com/v1"
api_key_env = "DEEPSEEK_API_KEY"     # key read from this env var
model = "deepseek-chat"

# ---- one profile, several models (expands to kimi/kimi-k2, kimi/moonshot-v1-8k) ----

[profiles.kimi]
base_url = "https://api.moonshot.cn/v1"
api_key_env = "MOONSHOT_API_KEY"
models = ["kimi-k2-0905-preview", "moonshot-v1-8k"]

[profiles.openai]
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
models = ["gpt-4o", "gpt-4o-mini"]

[profiles.openrouter]
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
model = "openai/gpt-4o-mini"
headers = { "HTTP-Referer" = "https://localhost", "X-Title" = "llmtap" }

# ---- local servers: no key needed ----

[profiles.ollama]
base_url = "http://127.0.0.1:11434/v1"
model = "qwen2.5:7b"
max_tokens = 256

[profiles.lmstudio]
base_url = "http://127.0.0.1:1234/v1"
model = "qwen2.5-7b-instruct"

# ---- optional pricing, USD per 1M tokens. Key = model id or substring. ----

[pricing."deepseek-chat"]
input = 0.27
output = 1.10

[pricing."gpt-4o"]
input = 2.50
output = 10.00

[pricing."gpt-4o-mini"]
input = 0.15
output = 0.60
