[project]
name = "llmtap"
version = "0.4.0"
description = "Terminal LLM API tester: TTFT, throughput, token stats and a TUI that shows every model config"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "yang" }]
requires-python = ">=3.10"
keywords = ["llm", "openai", "api", "benchmark", "ttft", "latency", "tui"]
classifiers = [
    "Environment :: Console",
    "Environment :: Console :: Curses",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Benchmark",
]
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
    "textual>=1.0",
    "typer>=0.12",
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/Teyeray/llmtap"
Repository = "https://github.com/Teyeray/llmtap"
Issues = "https://github.com/Teyeray/llmtap/issues"
Changelog = "https://github.com/Teyeray/llmtap/blob/main/CHANGELOG.md"

[project.scripts]
llmtap = "llmtap.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "pyflakes>=3.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llmtap"]
